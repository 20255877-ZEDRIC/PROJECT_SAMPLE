<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Ian's Creatives</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e5e5e5;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2b2d31;
            color: #ffffff;
            padding: 18px 0;
            text-align: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background-color: #265c83;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: bold;
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 35px;
        }

        nav ul li a {
            color: #cccccc;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background-color: #f7f8f9;
            width: 100%;
            max-width: 550px;
            padding: 45px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h2 {
            font-size: 1.4rem;
            text-transform: uppercase;
            color: #1a1a1a;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .card p {
            font-size: 0.85rem;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-home {
            display: inline-block;
            background-color: #2b2d31;
            color: #ffffff;
            padding: 10px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
        }

      
        footer {
            background-color: #1a1d20;
            color: #ffffff;
            text-align: center;
            padding: 6px 0;
            font-size: 0.7rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">IC</div>
            <h1>Ian's Creatives</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="ABOUT_SECTION.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="CONTACT_SECTION.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="content-wrapper">
        <div class="card">
            <h2>Thank You!</h2>
            <p>Your message has been submitted successfully. We will get back to you as soon as possible.</p>
            <a href="index.html" class="btn-home">Back to Home</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Padayao Zedric Creatives Creatives
    </footer>

</body>
</html>
